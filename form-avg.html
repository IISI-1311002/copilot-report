<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>問卷平均分數計算器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --ink: #1f2a33;
    --ink-soft: #5b6b78;
    --paper: #f6f8f9;
    --card: #ffffff;
    --line: #dde4e9;
    --accent: #0e7490;
    --accent-soft: #e0f2f7;
    --bar-track: #edf2f5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding: 40px 20px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: .02em; }
  header p { color: var(--ink-soft); margin-top: 6px; font-size: .92rem; }

  #dropzone {
    border: 2px dashed var(--line);
    border-radius: 12px;
    background: var(--card);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    font-size: .92rem;
  }
  #dropzone.dragover { border-color: var(--accent); background: var(--accent-soft); }
  #dropzone .icon { font-size: 1.3rem; }
  #dropzone strong { color: var(--accent); }
  #dropzone p { color: var(--ink-soft); font-size: .8rem; width: 100%; margin-top: 2px; }
  #fileInput { display: none; }

  #status { margin-top: 14px; font-size: .9rem; color: var(--ink-soft); min-height: 1.3em; }
  #status.error { color: #b91c1c; }

  #result { margin-top: 26px; display: none; }
  .filemeta {
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    font-size: .88rem; color: var(--ink-soft); margin-bottom: 12px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .row {
    display: grid;
    grid-template-columns: 44px 1fr 150px 64px;
    align-items: center;
    gap: 12px;
    padding: 13px 18px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-of-type { border-bottom: none; }
  .col-letter {
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: .85rem; font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 6px;
    text-align: center;
    padding: 4px 0;
  }
  .q-title { font-size: .92rem; line-height: 1.4; }
  .bar {
    height: 8px; border-radius: 4px; background: var(--bar-track);
    overflow: hidden;
  }
  .bar > i {
    display: block; height: 100%; width: 0;
    background: var(--accent);
    border-radius: 4px;
    transition: width .6s ease;
  }
  .score { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; font-size: 1rem; }

  .total {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 18px;
    background: var(--accent);
    color: #fff;
  }
  .total span { font-size: .95rem; }
  .total b { font-size: 1.7rem; font-variant-numeric: tabular-nums; }

  @media (max-width: 560px) {
    .row { grid-template-columns: 38px 1fr 56px; }
    .bar { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>問卷平均分數計算器</h1>
    <p>拖拉上傳問卷回饋 .xlsx 檔，自動計算 H～N 欄各題平均分，及各欄平均分加總後的總平均分。</p>
  </header>

  <div id="dropzone" tabindex="0">
    <span class="icon">📊</span>
    <span>將 .xlsx 檔拖曳到這裡，或 <strong>點擊選擇檔案</strong>；重新拖入即重新計算</span>
    <p>僅在瀏覽器本機計算，檔案不會上傳到任何伺服器</p>
  </div>
  <input type="file" id="fileInput" accept=".xlsx,.xls">
  <div id="status"></div>

  <div id="result">
    <div class="filemeta">
      <span id="fileName"></span>
      <span id="rowCount"></span>
    </div>
    <div class="card">
      <div id="rows"></div>
      <div class="total">
        <span>總平均分（H～N 各欄平均分加總後平均）</span>
        <b id="totalScore">—</b>
      </div>
    </div>
  </div>
</div>

<script>
const COL_START = 7;   // H 欄 (0-based)
const COL_END   = 13;  // N 欄
const MAX_SCORE = 5;   // 長條圖滿分基準

const dz = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const rowsEl = document.getElementById('rows');

dz.addEventListener('click', () => fileInput.click());
dz.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
fileInput.addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
  fileInput.value = '';   // 允許重複選擇同一檔案
});

['dragenter','dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('dragover'); }));
['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('dragover'); }));
dz.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) handleFile(f);
});

function setStatus(msg, isError) {
  statusEl.textContent = msg;
  statusEl.classList.toggle('error', !!isError);
}

function handleFile(file) {
  if (!/\.xlsx?$/i.test(file.name)) {
    setStatus('請選擇 .xlsx 或 .xls 檔案', true);
    return;
  }
  setStatus('讀取中…');
  const reader = new FileReader();
  reader.onerror = () => setStatus('檔案讀取失敗，請重試', true);
  reader.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
      compute(data, file.name);
    } catch (err) {
      console.error(err);
      setStatus('無法解析此檔案，請確認格式是否正確', true);
    }
  };
  reader.readAsArrayBuffer(file);
}

function compute(data, fileName) {
  if (!data || data.length < 2) {
    setStatus('檔案中沒有資料列（需含標題列與至少一筆回覆）', true);
    return;
  }
  const header = data[0];
  const body = data.slice(1).filter(r => r && r.some(c => c !== null && c !== ''));

  const results = [];
  for (let c = COL_START; c <= COL_END; c++) {
    let sum = 0, n = 0;
    for (const row of body) {
      const v = Number(row[c]);
      if (row[c] !== null && row[c] !== '' && !isNaN(v)) { sum += v; n++; }
    }
    results.push({
      letter: String.fromCharCode(65 + c),
      title: header[c] != null ? String(header[c]) : '（無標題）',
      avg: n ? sum / n : null,
      count: n
    });
  }

  const valid = results.filter(r => r.avg !== null);
  if (!valid.length) {
    setStatus('H～N 欄中找不到可計算的數值，請確認欄位位置', true);
    return;
  }
  const total = valid.reduce((s, r) => s + r.avg, 0) / valid.length;

  rowsEl.innerHTML = '';
  for (const r of results) {
    const div = document.createElement('div');
    div.className = 'row';
    const avgText = r.avg === null ? '—' : r.avg.toFixed(2);
    const pct = r.avg === null ? 0 : Math.min(100, r.avg / MAX_SCORE * 100);
    div.innerHTML =
      `<span class="col-letter">${r.letter}</span>` +
      `<span class="q-title"></span>` +
      `<span class="bar"><i></i></span>` +
      `<span class="score">${avgText}</span>`;
    div.querySelector('.q-title').textContent = r.title;
    rowsEl.appendChild(div);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      div.querySelector('.bar > i').style.width = pct + '%';
    }));
  }

  document.getElementById('fileName').textContent = fileName;
  document.getElementById('rowCount').textContent = `回覆筆數：${body.length}`;
  document.getElementById('totalScore').textContent = total.toFixed(2);

  setStatus('');
  resultEl.style.display = 'block';
}
</script>
</body>
</html>
